################################################################################
# W&B Sweep for legacy AE model with residual connections enabled
# Targets: NN_batch_correct.py with --use_residual
# Notes:
#  - Residual MLP requires uniform hidden sizes for encoder/decoder.
#  - Uses absolute venv python for consistency on Windows.
#  - Keeps objective_score as primary metric per existing sweep.
################################################################################

program: tools/sweep_nn_residual_entry.py
project: nn-batch-correction
method: bayes
metric:
  name: objective_overcorr
  goal: maximize

early_terminate:
  type: hyperband
  min_iter: 12
  s: 2

command:
  - ${env}
  - C:/Users/stef1/OneDrive/Documents/vscode/NNBatchCorrection/.venv/Scripts/python.exe
  - tools/sweep_nn_residual_entry.py
  - --counts
  - bulk_counts.csv
  - --metadata
  - sample_meta.csv
  - --genes_in_rows
  - --sample_col
  - sample
  - --batch_col
  - batch
  - --label_col
  - condition
  - --epochs
  - 5
  - --out_corrected
  - corrected_logcpm.csv
  - --out_latent
  - latent.csv
  - --use_wandb
  - --wandb_log
  - gradients
  - --early_stop_metric
  - objective_overcorr
  - --log_latent_every
  - 0
  - --patience
  - 25
  - --min_epochs
  - 5
  - --early_stop_delta
  - 0.002
 # - --stop_on_negative
  - --use_residual
  - --generate_viz
  - --amp
  - --pin_memory
  # wrapper will generate visualisations after training
  - ${args}

parameters:
  # Architecture: use uniform hidden sizes for residual MLPs
  hvg:
    values: [5000, 8000]
  latent_dim:
    values: [24, 32]
  enc_hidden:
    # Residual requires uniform hidden sizes per MLP
    values: ["256,256", "256,256,256", "512,512"]
  dec_hidden:
    values: ["256,256", "256,256,256", "512,512"]
  adv_hidden:
    values: ["128"]
  sup_hidden:
    values: ["64", "128"]
  scheduler:
    value: cosine_warmup
  warmup_ratio:
    # Only used when scheduler=cosine_warmup
    distribution: uniform
    min: 0.09
    max: 0.13
  grad_accum:
    values: [1, 2]
  recon_loss:
    values: ["huber", "mse"]
  adv_lambda_schedule:
    values: ["sigmoid"]

  # Continuous / probabilistic
  dropout:
    distribution: uniform
    min: 0.05
    max: 0.12
  lr:
    distribution: log_uniform_values
    min: 0.0007
    max: 0.0009
  weight_decay:
    values: [0.0, 1e-5, 1e-4]

  # Loss balancing
  adv_weight:
    values: [0.6, 0.8]
  sup_weight:
    values: [0.6, 0.8, 1.0]

  # Training dynamics
  batch_size:
    values: [32, 48]
  adaptive_high_margin:
    distribution: uniform
    min: 0.18
    max: 0.45
  adaptive_low_margin:
    distribution: uniform
    min: 0.03
    max: 0.09

  # Logging cadence (kept fixed for speed)
  wandb_log_freq:
    value: 1

  # Visual output filenames (read by wrapper and passed to visualiser)
  viz_pca_before:
    value: pca_before.png
  viz_pca_after:
    value: pca_after.png
  viz_pca_panel:
    value: pca_panel.png
  # Multiple seeds for robustness
  seed:
    values: [42, 1337]
  # Overcorrection penalty controls
  cond_min:
    values: [0.25, 0.35, 0.45]
  overcorr_weight:
    values: [1.0, 1.5, 2.0]
  # Differentiable biology-preserving loss and adaptive adversary
  bio_weight:
    values: [0.0] # Bruh, this is the only value that works with residuals
  bio_gamma:
    value: 0.5
  adaptive_cond_margin:
    values: [0.05, 0.08]
  adaptive_cond_scale:
    values: [0.4, 0.5, 0.6]

################################################################################
# Usage:
#   pwsh .\run_wandb_sweep.ps1 -Entity <your_entity> -Project nn-batch-correction \
#       -Yaml wandb_sweep_nn_residual.yaml -Agents 1
################################################################################
