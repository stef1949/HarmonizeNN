program: VAEModel/vaemodeltest.py
method: bayes
metric:
  name: objective_overcorr
  goal: maximize

# Explicit command to properly handle boolean flags (store_true)
command:
  - ${env}
  - python
  - ${program}
  - --use_wandb
  - --amp
  - --pin_memory
  - --cudnn_benchmark
  - --fused_optim
  - --generate_viz
  - ${args}

parameters:
  counts:
    value: data/bulk_counts.csv
  metadata:
    value: data/sample_meta.csv
  sample_col:
    value: sample
  batch_col:
    value: batch
  label_col:
    value: condition
  out_corrected:
    value: sweep_corrected.csv
  out_latent:
    value: artifacts/outputs/sweep_latent.csv
  viz_pca_panel:
    value: artifacts/outputs/sweep_pca_panel.png
  viz_pca_before:
    value: artifacts/outputs/sweep_pca_before.png
  viz_pca_after:
    value: artifacts/outputs/sweep_pca_after.png
  viz_boxplot:
    value: sweep_boxplots.png
  # Overcorrection penalty controls
  cond_min:
    values: [0.10, 0.20, 0.30]
  overcorr_weight:
    values: [0.5, 1.0]
  # Differentiable biology-preserving loss and adaptive adversary
  bio_weight:
    values: [0.0, 0.1, 0.3, 0.5]
  bio_gamma:
    values: [0.5]
  adaptive_cond_margin:
    values: [0.02, 0.03]
  adaptive_cond_scale:
    values: [0.6, 0.7, 0.85]
  epochs:
    value: 120
  patience:
    value: 25
  hvg:
    values: [3000, 5000]
  latent_dim:
    values: [16, 24, 32]
  enc_hidden:
    values: ["1024,256", "1024,512,256"]
  dec_hidden:
    values: ["256,1024", "256,512,1024"]
  adv_hidden:
    values: ["128", "256"]
  sup_hidden:
    values: ["64", "128"]
  # Number of attention heads for the self-attention block
  attention_heads:
    values: [2, 4, 8]
  adv_weight:
    min: 1.0
    max: 5.0
  sup_weight:
    min: 0.5
    max: 2.0
  # AdamW weight decay (includes 0 to disable)
  weight_decay:
    values: [0.0, 0.00001, 0.0001, 0.001]
  kl_weight:
    distribution: log_uniform_values
    min: 0.0005
    max: 0.01
  dropout:
    values: [0.1, 0.2, 0.3]
  lr:
    distribution: log_uniform_values
    min: 0.00005
    max: 0.002
  batch_size:
    values: [64, 96, 128]
  # Numerical precision mode swept alongside AMP
  precision:
    values: ["auto", "bf16", "fp16"]
  # Effective batch growth for memory-constrained GPUs
  grad_accum:
    values: [1, 2]
  num_workers:
    value: 4
  scheduler:
    value: cosine_warmup
  warmup_ratio:
    value: 0.05
  log_latent_every:
    value: 20
  viz_hvg_top:
    value: 2000
  seed:
    values: [42, 1337]

early_terminate:
  type: hyperband
  min_iter: 20
